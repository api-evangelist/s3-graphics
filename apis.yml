name: S3 Graphics
description: S3 Graphics, Inc. is a legacy graphics, video, and multimedia accelerator company known for
  its GPU architectures (Savage, Chrome and DeltaChrome, plus the earlier ViRGE and Trio chipsets) and
  its display drivers. Originally founded as S3 Incorporated in 1989, the graphics business later operated
  as S3 Graphics under VIA and HTC ownership. Its public web presence is a legacy marketing and driver-download
  site (still Flash/Ruffle based); it exposes no modern web API, SDK, or developer platform. The historical
  "Developers" area was a hardware developer-relations channel offering GPU sample cards during the DeltaChrome
  era, not a programmatic API.
